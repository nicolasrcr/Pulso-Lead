name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint:sql
      - name: Migrations + testes de isolamento e auth (RLS)
        env: { DATABASE_URL: "postgres://postgres:postgres@localhost:5432/postgres" }
        run: scripts/run-db-tests.sh
      - name: Papel da aplicação com login (testes de integração da API)
        run: psql "postgres://postgres:postgres@localhost:5432/postgres" -c "alter role app_user password 'app_pw'"
      - name: Testes (inclui integração da API com Postgres real como app_user)
        env:
          TEST_ADMIN_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/postgres"
          TEST_APP_DATABASE_URL: "postgres://app_user:app_pw@localhost:5432/postgres"
        run: pnpm test
